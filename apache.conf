# Apache vhost for the Vue3 portfolio (dist/), upgraded from HTTP/1.1 to HTTP/2.
#
# Requirements to actually get HTTP/2:
#   - Apache >= 2.4.17 with mod_http2 available (Debian/Ubuntu: `a2enmod http2`).
#   - MPM must be "event" or "worker" (mod_http2 does NOT work with the
#     prefork MPM). Check with `apachectl -M | grep mpm` and switch if needed:
#       a2dismod mpm_prefork; a2enmod mpm_event
#   - `Protocols h2 http/1.1` must be set (globally in apache2.conf/httpd.conf,
#     or per-vhost as below). Browsers only negotiate h2 over TLS (via ALPN),
#     so this only takes effect inside the *:443 VirtualHost.
#   - After enabling, reload/restart: `a2enmod http2 && systemctl restart apache2`
#     and verify with: `curl -I --http2 -s https://kristof-kamin.de/ | grep HTTP`
#     (should report "HTTP/2 200").
#
# HTTP/2 -> HTTP/3 (QUIC):
#   Stock Apache HTTP Server (httpd) has NO stable/official HTTP/3 support yet
#   (unlike nginx >= 1.25). Options to get HTTP/3 in front of this vhost:
#     1. Put a QUIC-capable reverse proxy / CDN (e.g. nginx with http3, Caddy,
#        or a CDN like Cloudflare) in front of Apache, terminating HTTP/3
#        towards clients and proxying HTTP/1.1 or HTTP/2 to this Apache vhost.
#     2. Use the third-party experimental `mod_http3`/`mod_quic` modules
#        (e.g. from the mod_h2 author, https://github.com/icing/mod_h2/),
#        which are not part of official Apache releases and require building
#        Apache against a QUIC-enabled TLS library (e.g. quictls).
#   Given the added complexity/maturity risk, option 1 (nginx/Caddy/CDN in
#   front for HTTP/3, Apache behind for HTTP/2) is the recommended path if
#   HTTP/3 is required while keeping Apache as the app server.

<VirtualHost *:443>
    ServerName  kristof-kamin.de
    ServerAlias www.kristof-kamin.de

    # ── HTTP/2 ────────────────────────────────────────────────────────────────
    # Requires mod_http2 enabled and MPM event/worker (see notes above).
    Protocols h2 http/1.1

    # ── Document root (Vite build output) ────────────────────────────────────
    DocumentRoot /var/www/html/portfolio/dist

    <Directory /var/www/html/portfolio/dist>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted

        # Vue Router (createWebHistory) — send all non-file requests to index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # ── PHP mailer endpoint ───────────────────────────────────────────────────
    # mail.php lives in the webroot alongside dist/
    Alias /mail.php /var/www/html/portfolio/mail.php

    <Directory /var/www/html/portfolio>
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\.php$">
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    # ── Security headers ──────────────────────────────────────────────────────
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "DENY"
    Header always set X-XSS-Protection         "1; mode=block"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"
    Header always set Permissions-Policy        "geolocation=(), microphone=(), camera=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Advertise HTTP/3 to browsers in case a QUIC-capable proxy/CDN sits in
    # front of this Apache instance and terminates :443/udp for this host
    # (see the HTTP/3 notes at the top of this file). Harmless no-op otherwise.
    # Header always set Alt-Svc 'h3=":443"; ma=86400'

    # ── Static asset caching ─────────────────────────────────────────────────
    <LocationMatch "\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico|gif)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # HTML and manifest — always revalidate
    <LocationMatch "\.(html|webmanifest)$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # ── SSL ───────────────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/apache.crt
    SSLCertificateKeyFile /etc/ssl/private/apache.key
    SSLCertificateChainFile /etc/apache2/ssl.crt/server-ca.crt

    # Modern TLS only
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    # ── Logging ───────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/kristof-kamin.de_error.log
    CustomLog ${APACHE_LOG_DIR}/kristof-kamin.de_access.log combined
</VirtualHost>

# ── HTTP -> HTTPS redirect ────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName  kristof-kamin.de
    ServerAlias www.kristof-kamin.de
    Redirect permanent / https://kristof-kamin.de/
</VirtualHost>
